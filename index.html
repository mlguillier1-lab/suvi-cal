<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi calories</title>
<style>
:root{--bg:#f4f1fb;--card:#fff;--ink:#231f3a;--mute:#7a7596;--line:#e8e3f4;--acc:#6c4cf1;--acc2:#b04cf1;--ok:#14a37f;--bad:#f0563f;--sh:0 4px 18px rgba(80,60,160,.09);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15131f;--card:#201d30;--ink:#eeecfa;--mute:#9c97b8;--line:#322e4a;--acc:#9a85ff;--acc2:#d28bff;--ok:#3fd1a8;--bad:#ff7d68;--sh:0 4px 18px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;padding:0 16px 110px}
main{max-width:640px;margin:0 auto}
header{margin:0 -16px 16px;padding:max(22px,env(safe-area-inset-top)) 22px 26px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
header .hi{font-size:1.6rem;font-weight:700}
header .sub{opacity:.88;text-transform:capitalize;margin-top:2px}
h2{font-size:1.05rem;margin:0 0 12px}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;display:flex;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(80,60,160,.08);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mute);font:inherit;font-size:.75rem;padding:6px;border-radius:14px;cursor:pointer}
nav button span{font-size:1.4rem;line-height:1.2}
nav button[aria-selected=true]{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);font-weight:600}
section{display:none}section.on{display:block;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.on{animation:none}}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:.82rem;color:var(--mute);margin:10px 0 4px}
input[type=number],input[type=date]{width:100%;padding:12px;border:2px solid transparent;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=number]:focus,input[type=date]:focus{border-color:var(--acc);outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{grid-template-columns:repeat(3,1fr)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--ink);font-size:1rem;padding:12px;border-radius:12px;background:var(--bg)}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font:inherit;font-weight:600;cursor:pointer}
.go:active{transform:scale(.98)}
.sec{background:var(--bg);color:var(--ink);font-weight:500}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{font-size:2.1rem;font-weight:700;line-height:1.1}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mute{color:var(--mute);font-size:.9rem}
.bhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:112px;height:112px;flex:none;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring.over{background:conic-gradient(var(--bad) 100%,var(--line) 0)}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring b{font-size:1.2rem}.ring span{font-size:.7rem;color:var(--mute)}
.macs{margin-top:14px;display:grid;gap:9px}
.mrow{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.bar .p{background:var(--acc)}.bar .g{background:#f5a524}.bar .l{background:#e0589b}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 6px;text-align:right;white-space:nowrap}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 70%,transparent)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
td button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:1.1rem}
.tip{border-radius:14px;background:var(--bg);padding:12px;margin-top:12px}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main>
<header><div class="hi">Suivi calories</div><div class="sub" id="hd"></div></header>
<nav role="tablist">
<button role="tab" data-t="j" aria-selected="true"><span>🍽️</span>Jour</button>
<button role="tab" data-t="s" aria-selected="false"><span>📈</span>Semaines</button>
<button role="tab" data-t="r" aria-selected="false"><span>⚙️</span>Réglages</button>
</nav>

<section id="j" class="on">
<div class="card">
<h2>✏️ Saisie du jour</h2>
<label for="d">Date</label><input id="d" type="date">
<div class="row">
<div><label for="k">Calories mangées</label><input id="k" type="number" inputmode="numeric" min="0"></div>
<div><label for="p">Nombre de pas</label><input id="p" type="number" inputmode="numeric" min="0"></div>
</div>
<div class="row r3">
<div><label for="mp">Protéines (g)</label><input id="mp" type="number" inputmode="numeric" min="0"></div>
<div><label for="mg">Glucides (g)</label><input id="mg" type="number" inputmode="numeric" min="0"></div>
<div><label for="ml">Lipides (g)</label><input id="ml" type="number" inputmode="numeric" min="0"></div>
</div>
<label class="chk"><input id="t" type="checkbox"> Séance de musculation faite</label>
<button class="go" id="sj">Enregistrer la journée</button>
</div>
<div class="card" id="bilan"></div>
<div class="card"><h2>🗓️ Derniers jours</h2><div class="scroll" id="hist"></div></div>
</section>

<section id="s">
<div class="card">
<h2>⚖️ Pesée et mensurations</h2>
<label for="wd">Date</label><input id="wd" type="date">
<div class="row">
<div><label for="w">Poids (kg)</label><input id="w" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="m1">Tour de taille (cm)</label><input id="m1" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="m2">Hanches (cm)</label><input id="m2" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="m3">Cuisse (cm)</label><input id="m3" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="m4">Bras (cm)</label><input id="m4" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="m5">Poitrine (cm)</label><input id="m5" type="number" step="0.1" inputmode="decimal"></div>
</div>
<button class="go" id="sw">Enregistrer la pesée</button>
</div>
<div class="card"><h2>📉 Évolution du poids</h2><div id="chart"></div><div id="tip"></div></div>
<div class="card"><h2>📊 Moyennes par semaine</h2><div class="scroll" id="weeks"></div></div>
<div class="card"><h2>🥩 Macros : moyennes par semaine</h2><div class="scroll" id="wmac"></div></div>
<div class="card"><h2>📏 Poids et mensurations</h2><div class="scroll" id="wt"></div></div>
</section>

<section id="r">
<div class="card">
<h2>🎯 Objectifs</h2>
<div class="row">
<div><label for="c1">Calories jour off</label><input id="c1" type="number" inputmode="numeric"></div>
<div><label for="c2">Calories jour de séance</label><input id="c2" type="number" inputmode="numeric"></div>
<div><label for="c3">Poids objectif (kg)</label><input id="c3" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="c4">Objectif de pas</label><input id="c4" type="number" inputmode="numeric"></div>
<div><label for="c5">Protéines (g/jour)</label><input id="c5" type="number" inputmode="numeric"></div>
<div><label for="c6">Lipides (g/jour)</label><input id="c6" type="number" inputmode="numeric"></div>
</div>
<button class="go" id="sc">Enregistrer les réglages</button>
</div>
<div class="card">
<h2>💾 Sauvegarde</h2>
<p class="mute">Les données restent dans ce navigateur. Exporte-les de temps en temps.</p>
<button class="go sec" id="ex">Exporter (fichier JSON)</button>
<button class="go sec" id="im">Importer un fichier JSON</button>
<input id="f" type="file" accept="application/json" hidden>
</div>
</section>
</main>

<script>
const K = 'suivi-calories-v1';
let S = { cfg: { off: 1819, train: 2129, goal: 71, steps: 10000, prot: 148, lip: 66 }, days: {}, wt: {} };
try { const r = localStorage.getItem(K); if (r) { const o = JSON.parse(r); S = { cfg: Object.assign(S.cfg, o.cfg), days: o.days || {}, wt: o.wt || {} }; } } catch (e) {}
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => iso(new Date());
const monday = s => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const fr = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
const n0 = n => n == null || isNaN(n) ? '–' : Math.round(n).toLocaleString('fr-FR');
const n1 = n => n == null || isNaN(n) ? '–' : n.toLocaleString('fr-FR', { maximumFractionDigits: 1 });
const sg = n => n == null ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR');
const goal = d => d.t ? S.cfg.train : S.cfg.off;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const num = id => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.t));
});

function loadDay() {
  const e = S.days[$('d').value];
  $('k').value = e ? e.k : ''; $('p').value = e && e.p != null ? e.p : ''; $('t').checked = !!(e && e.t);
  $('mp').value = e && e.pr != null ? e.pr : ''; $('mg').value = e && e.gl != null ? e.gl : ''; $('ml').value = e && e.li != null ? e.li : '';
  renderDay();
}
const mt = e => ({ p: S.cfg.prot, l: S.cfg.lip, g: (goal(e) - 4 * S.cfg.prot - 9 * S.cfg.lip) / 4 });
const mcell = (a, key, tk, up) => {
  const v = a.filter(e => e[key] != null); if (!v.length) return '<td>–</td>';
  const m = avg(v.map(e => e[key])), t = avg(v.map(e => mt(e)[tk])), d = m - t;
  const ok = up ? d >= -0.1 * t : Math.abs(d) <= 0.1 * t;
  return '<td class="' + (ok ? 'ok' : 'bad') + '">' + n0(m) + ' (' + sg(d) + ')</td>';
};
const bar = (label, v, t, c) => v == null ? '' : '<div class="mrow"><span>' + label + '</span><div class="bar"><i class="' + c + '" style="width:' + Math.min(100, Math.round(v / t * 100)) + '%"></i></div><span>' + n0(v) + ' / ' + n0(t) + ' g</span></div>';
const macLine = e => {
  if (e.pr == null && e.gl == null && e.li == null) return '';
  const T = mt(e);
  return '<div class="macs">' + bar('Protéines', e.pr, T.p, 'p') + bar('Glucides', e.gl, T.g, 'g') + bar('Lipides', e.li, T.l, 'l') + '</div>';
};
function renderDay() {
  const date = $('d').value, e = S.days[date];
  if (!e) { $('bilan').innerHTML = '<p class="mute">Rien d\'enregistré pour le ' + fr(date) + '. Entre tes calories et enregistre.</p>'; }
  else {
    const g = goal(e), diff = e.k - g, pct = Math.min(100, Math.round(e.k / g * 100));
    $('bilan').innerHTML = '<div class="bhead"><div class="ring ' + (diff > 0 ? 'over' : '') + '" style="--p:' + pct + '"><div><b>' + n0(e.k) + '</b><span>/ ' + n0(g) + ' kcal</span></div></div>' +
      '<div><div class="mute">' + fr(date) + ' · ' + (e.t ? '🏋️ jour de séance' : '🌿 jour off') + '</div>' +
      '<div class="big ' + (diff > 0 ? 'bad' : 'ok') + '">' + sg(diff) + ' kcal</div>' +
      '<div>' + (diff > 0 ? 'en trop' : diff < 0 ? 'en moins' : 'pile sur l\'objectif') + '</div></div></div>' +
      '<div class="mute" style="margin-top:12px">👟 Pas : ' + n0(e.p) + (e.p != null ? (e.p >= S.cfg.steps ? ' · objectif atteint 🎉' : ' · il manque ' + n0(S.cfg.steps - e.p)) : '') + '</div>' + macLine(e);
  }
  const ds = Object.keys(S.days).sort().reverse().slice(0, 14);
  $('hist').innerHTML = ds.length ? '<table><tr><th>Jour</th><th>Kcal</th><th>Objectif</th><th>Écart</th><th>Pas</th><th>Séance</th><th></th></tr>' +
    ds.map(k => { const e = S.days[k], d = e.k - goal(e); return '<tr><td>' + fr(k) + '</td><td>' + n0(e.k) + '</td><td>' + n0(goal(e)) + '</td><td class="' + (d > 0 ? 'bad' : 'ok') + '">' + sg(d) + '</td><td>' + n0(e.p) + '</td><td>' + (e.t ? 'oui' : 'non') + '</td><td><button data-del="' + k + '" aria-label="Supprimer le ' + fr(k) + '">×</button></td></tr>'; }).join('') + '</table>'
    : '<p class="mute">Aucune journée enregistrée pour l\'instant.</p>';
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { delete S.days[b.dataset.del]; save(); loadDay(); renderWeeks(); });
}
$('d').onchange = loadDay;
$('sj').onclick = () => {
  const k = num('k'); if (k == null || k < 0) { alert('Entre tes calories du jour.'); return; }
  S.days[$('d').value] = { k, p: num('p'), t: $('t').checked, pr: num('mp'), gl: num('mg'), li: num('ml') };
  save(); renderDay(); renderWeeks();
};

function weekWeights() {
  const m = {};
  Object.keys(S.wt).sort().forEach(d => { m[monday(d)] = Object.assign({ date: d }, S.wt[d]); });
  return m;
}
function renderWeeks() {
  const wk = {};
  Object.keys(S.days).forEach(d => { (wk[monday(d)] = wk[monday(d)] || []).push(S.days[d]); });
  const ww = weekWeights();
  const keys = Object.keys(wk).sort().reverse().slice(0, 12);
  $('weeks').innerHTML = keys.length ? '<table><tr><th>Semaine du</th><th>Jours</th><th>Kcal moy.</th><th>Écart moy.</th><th>Écart total</th><th>Séances</th><th>Pas moy.</th></tr>' +
    keys.map(k => { const a = wk[k], di = a.map(e => e.k - goal(e)), am = avg(di);
      return '<tr><td>' + fr(k) + '</td><td>' + a.length + '/7</td><td>' + n0(avg(a.map(e => e.k))) + '</td><td class="' + (am > 0 ? 'bad' : 'ok') + '">' + sg(am) + '</td><td>' + sg(di.reduce((x, y) => x + y, 0)) + '</td><td>' + a.filter(e => e.t).length + '</td><td>' + n0(avg(a.filter(e => e.p != null).map(e => e.p))) + '</td></tr>'; }).join('') + '</table>'
    : '<p class="mute">Les moyennes apparaîtront dès que tu auras enregistré des journées.</p>';
  const mk = keys.filter(k => wk[k].some(e => e.pr != null || e.gl != null || e.li != null));
  $('wmac').innerHTML = mk.length ? '<table><tr><th>Semaine du</th><th>Protéines</th><th>Glucides</th><th>Lipides</th></tr>' +
    mk.map(k => '<tr><td>' + fr(k) + '</td>' + mcell(wk[k], 'pr', 'p', true) + mcell(wk[k], 'gl', 'g') + mcell(wk[k], 'li', 'l') + '</tr>').join('') +
    '</table><p class="mute">Moyenne en g par jour, avec l\'écart par rapport à l\'objectif entre parenthèses.</p>'
    : '<p class="mute">Enregistre tes macros pour voir les moyennes de la semaine.</p>';

  const wks = Object.keys(ww).sort();
  const rows = wks.slice().reverse().map((k, i, arr) => { const x = ww[k], prev = arr[i + 1] ? ww[arr[i + 1]] : null; const dl = prev && x.w != null && prev.w != null ? x.w - prev.w : null;
    return '<tr><td>' + fr(x.date) + '</td><td>' + n1(x.w) + '</td><td>' + (dl == null ? '–' : (dl > 0 ? '+' : dl < 0 ? '−' : '') + Math.abs(dl).toFixed(1).replace('.', ',')) + '</td><td>' + n1(x.m1) + '</td><td>' + n1(x.m2) + '</td><td>' + n1(x.m3) + '</td><td>' + n1(x.m4) + '</td><td>' + n1(x.m5) + '</td></tr>'; });
  $('wt').innerHTML = rows.length ? '<table><tr><th>Date</th><th>Poids</th><th>Var.</th><th>Taille</th><th>Hanches</th><th>Cuisse</th><th>Bras</th><th>Poitrine</th></tr>' + rows.join('') + '</table>'
    : '<p class="mute">Aucune pesée enregistrée.</p>';
  chart(wks.map(k => ww[k]).filter(x => x.w != null));
  advice(wks, ww, wk);
}
function chart(p) {
  if (p.length < 2) { $('chart').innerHTML = '<p class="mute">Il faut au moins deux pesées pour tracer la courbe.</p>'; return; }
  const W = 600, H = 220, L = 38, R = 12, T = 12, B = 26;
  const vals = p.map(x => x.w).concat(S.cfg.goal), lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const X = i => L + i * (W - L - R) / (p.length - 1), Y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Courbe du poids">' +
    '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(S.cfg.goal) + '" y2="' + Y(S.cfg.goal) + '" stroke="var(--ok)" stroke-dasharray="5 4"/>' +
    '<text x="' + (W - R) + '" y="' + (Y(S.cfg.goal) - 4) + '" text-anchor="end" font-size="11" fill="var(--ok)">objectif ' + n1(S.cfg.goal) + '</text>' +
    '<text x="4" y="' + (T + 4) + '" font-size="11" fill="var(--mute)">' + hi + '</text><text x="4" y="' + (H - B) + '" font-size="11" fill="var(--mute)">' + lo + '</text>' +
    '<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="' + p.map((x, i) => X(i) + ',' + Y(x.w)).join(' ') + '"/>' +
    p.map((x, i) => '<circle cx="' + X(i) + '" cy="' + Y(x.w) + '" r="4" fill="var(--acc)"/><text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--mute)">' + fr(x.date) + '</text>').join('') + '</svg>';
}
function advice(wks, ww, wk) {
  const el = $('tip');
  if (wks.length < 2) { el.innerHTML = ''; return; }
  const a = ww[wks[wks.length - 2]], b = ww[wks[wks.length - 1]];
  if (a.w == null || b.w == null) { el.innerHTML = ''; return; }
  const d = b.w - a.w, week = wk[wks[wks.length - 1]] || wk[wks[wks.length - 2]] || [];
  const am = week.length >= 4 ? avg(week.map(e => e.k - goal(e))) : null;
  let m;
  if (b.w <= S.cfg.goal) m = 'Objectif de ' + n1(S.cfg.goal) + ' kg atteint. Tu peux remonter les calories vers la maintenance.';
  else if (d > -0.1) m = 'Poids stable ou en hausse (' + (d > 0 ? '+' : '−') + Math.abs(d).toFixed(1).replace('.', ',') + ' kg).' + (am != null && am > 100 ? ' Tu dépasses ton objectif en moyenne : commence par tenir les calories prévues.' : ' Si ça dure 2 à 3 semaines, baisse l\'objectif d\'environ 100 à 150 kcal.');
  else if (d < -0.7) m = 'Perte rapide (−' + Math.abs(d).toFixed(1).replace('.', ',') + ' kg). Pour préserver ta masse musculaire, remonte l\'objectif d\'environ 100 à 150 kcal.';
  else m = 'Rythme de perte correct (−' + Math.abs(d).toFixed(1).replace('.', ',') + ' kg). Garde les calories actuelles.';
  el.innerHTML = '<div class="tip">' + m + '<div class="mute">Repère indicatif : environ 0,2 à 0,6 kg par semaine. Le poids varie d\'un jour à l\'autre, regarde la tendance sur 2 à 3 semaines.</div></div>';
}
$('sw').onclick = () => {
  const w = num('w'); if (w == null) { alert('Entre ton poids.'); return; }
  S.wt[$('wd').value] = { w, m1: num('m1'), m2: num('m2'), m3: num('m3'), m4: num('m4'), m5: num('m5') };
  save(); renderWeeks();
};

function loadCfg() { $('c1').value = S.cfg.off; $('c2').value = S.cfg.train; $('c3').value = S.cfg.goal; $('c4').value = S.cfg.steps; $('c5').value = S.cfg.prot; $('c6').value = S.cfg.lip; }
$('sc').onclick = () => {
  const v = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'].map(num); if (v.includes(null)) { alert('Remplis tous les champs.'); return; }
  S.cfg = { off: v[0], train: v[1], goal: v[2], steps: v[3], prot: v[4], lip: v[5] };
  save(); renderDay(); renderWeeks(); alert('Réglages enregistrés.');
};
$('ex').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = 'suivi-calories-' + today() + '.json'; a.click();
};
$('im').onclick = () => $('f').click();
$('f').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); S = { cfg: Object.assign(S.cfg, o.cfg), days: o.days || {}, wt: o.wt || {} }; save(); loadCfg(); loadDay(); renderWeeks(); alert('Données importées.'); } catch (x) { alert('Fichier invalide.'); } };
  r.readAsText(f);
};

$('d').value = today(); $('wd').value = today();
$('hd').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
loadCfg(); loadDay(); renderWeeks();
</script>
</body>
</html>
